<main>
  <section class="hero" style="padding-bottom:0;">
    <div class="hero-circles" aria-hidden="true">
      <span style="width:180px;height:180px;top:-60px;left:50%;transform:translateX(-50%);background:var(--mauve-soft);"></span>
    </div>
    <div class="container contact-block">
      <span class="eyebrow">Contact</span>
      <h1>Interested in discussing research fit or my application?</h1>
      <p class="lede" style="margin:0 auto;">Send me a message directly, or reach out through the links below.</p>

      <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html" style="max-width:480px; margin:32px auto; text-align:left;">
        <input type="hidden" name="form-name" value="contact">
        <p style="display:none;">
          <label>Don't fill this out if you're human: <input name="bot-field"></label>
        </p>

        <div style="margin-bottom:16px;">
          <label for="name" style="display:block; margin-bottom:6px; font-weight:600;">Name</label>
          <input type="text" id="name" name="name" required style="width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-family:var(--font-body); font-size:1rem;">
        </div>

        <div style="margin-bottom:16px;">
          <label for="email" style="display:block; margin-bottom:6px; font-weight:600;">Email</label>
          <input type="email" id="email" name="email" required style="width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-family:var(--font-body); font-size:1rem;">
        </div>

        <div style="margin-bottom:16px;">
          <label for="message" style="display:block; margin-bottom:6px; font-weight:600;">Message</label>
          <textarea id="message" name="message" rows="5" required style="width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-family:var(--font-body); font-size:1rem;"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Send message</button>
      </form>

      <div class="contact-emails" style="margin-top:8px;">
        <a href="mailto:Saleharehan97@gmail.com">Saleharehan97@gmail.com</a>
      </div>

      <div class="contact-links" style="margin-top:24px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap;">
        <a href="https://www.linkedin.com/in/saleha-rehan/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/saleharehan97-del" target="_blank" rel="noopener">GitHub</a>
        <a href="https://calendly.com/saleharehan97/30min" target="_blank" rel="noopener">Book a call</a>
        <a href="cv.html">CV</a>
      </div>
    </div>
